<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Chơi thử minigame – RinhQuà</title>
  <meta name="description" content="Chơi thử miễn phí vòng quay may mắn, lật thẻ, cào trúng thưởng, mở hộp quà – rồi tạo game cho cửa hàng của bạn.">
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/play.css">
  <style>
    body.play { --theme-bg: #fff4e6; --theme: #ff4d3d; }
    .demo-nav { background: #fff; border-bottom: 1px solid var(--line); }
    .demo-nav .in { max-width: 960px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 12px; justify-content: space-between; }
    .switcher { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin: 4px 0 6px; }
    .switcher a { text-decoration: none; color: #344054; background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; font-size: 14px; font-weight: 600; }
    .switcher a.on { background: var(--brand); color: #fff; border-color: var(--brand); }
    .demo-tag { display: inline-block; background: #1d2433; color: #fff; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; }
    .cta-panel { text-align: center; }
    .cta-panel .btn { margin-top: 6px; }
  </style>
</head>
<body class="play">
  <header class="demo-nav"><div class="in">
    <a class="logo-mark" href="/"><span class="dot">🎁</span>RinhQuà</a>
    <a class="btn small" href="/app#/register">Tạo game miễn phí</a>
  </div></header>
  <div class="play-shell">
    <nav class="switcher" id="switcher"></nav>
    <header class="play-head">
      <span class="demo-tag">CHƠI THỬ</span>
      <h1 id="title"></h1>
      <p id="desc"></p>
    </header>
    <div class="center" style="margin:6px 0 4px"><span class="plays-left">Lượt chơi thử: <b>không giới hạn</b></span></div>
    <section id="game"></section>
    <section class="panel">
      <h2>🎁 Quà mẫu trong bản chơi thử</h2>
      <div class="prize-list" id="prizes"></div>
    </section>
    <section class="panel cta-panel">
      <h2>Muốn có game này cho cửa hàng của bạn?</h2>
      <p class="muted" style="margin:0">Đổi logo, màu sắc, quà tặng theo thương hiệu – lên sóng trong 5 phút, miễn phí để bắt đầu.</p>
      <a class="btn" id="cta" href="/app#/register">Tạo game này miễn phí →</a>
    </section>
    <div class="watermark"><a href="/">← Về trang chủ RinhQuà</a></div>
  </div>
  <script type="module" src="/js/demo.js"></script>
</body>
</html>
